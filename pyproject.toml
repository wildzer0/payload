[project]
name = "payload"
version = "0.2.0"
description = "Tool da terminale per gestire tabelle di sistemi embedded"
requires-python = ">=3.10"
license = { text = "Elastic-2.0" }
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "watchdog>=4.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",   # stessa famiglia di tomli, wheel py3-none-any: nessuna estensione compilata (vedi core/config.py)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "httpx2>=2.0",   # richiesto da starlette.testclient.TestClient (usato per testare 'pld serve') — 'httpx' classico è deprecato da starlette a favore di questo
    "python-multipart>=0.0.9",   # richiesto da Request.form() nei test di /api/table/import (upload multipart)
]
build = [
    "pyinstaller>=6.6",
]
serve = [
    "starlette>=0.37",
    "uvicorn>=0.29",   # deliberatamente NON 'uvicorn[standard]': niente uvloop/httptools (dipendenze compilate)
    "python-multipart>=0.0.9",   # richiesto da Request.form() per il multipart/form-data di /api/table/import (upload file)
]

[project.scripts]
pld = "payload.cli:app"

# Plugin builtin, registrati esattamente come farebbe un pacchetto di terze
# parti — dimostra che il core non ha trattamento speciale per i "propri" plugin.
[project.entry-points."payload.readers"]
raw_text = "payload.readers.raw_text:RawTextReader"
csv = "payload.readers.csv_reader:CsvReader"
c_source = "payload.readers.c_source:CSourceReader"

[project.entry-points."payload.writers"]
bin = "payload.writers.bin_writer:BinWriter"
hex = "payload.writers.hex_writer:HexWriter"
obj = "payload.writers.obj_writer:ObjWriter"
header = "payload.writers.header_writer:HeaderWriter"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Senza questo, setuptools NON include i file non-.py nel wheel (bug
# preesistente scoperto costruendo un wheel reale: 'payload.templates'
# mancava questa sezione, quindi 'pld init'/'pld plugin new' installati
# da un wheel — non in modalità -e/editable — non trovavano i propri
# file sorgente).
"payload.templates" = ["init/*", "plugin_scaffold/**/*"]
"payload.web" = [
    "static/*.html", "static/*.js", "static/*.css",
    "static/vendor/codemirror/*.js", "static/vendor/codemirror/*.css",
    "static/vendor/codemirror/LICENSE", "static/vendor/codemirror/mode/python/*.js",
]
"payload.docs" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=payload --cov-report=term-missing"

[tool.coverage.run]
source = ["src/payload"]
omit = [
    "src/payload/templates/*",  # template renderizzati a runtime, non codice eseguito direttamente
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
