[project]
name = "{{plugin_name}}"
version = "0.1.0"
description = "{{plugin_kind}} plugin for payload"
requires-python = ">=3.10"
dependencies = [
    "payload",
]

[project.entry-points."payload.{{plugin_group}}"]
{{plugin_slug}} = "{{plugin_name}}.plugin:{{plugin_class}}"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
